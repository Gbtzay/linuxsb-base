name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build developer artifacts
        run: npm run build:dev

      - name: Build release artifacts
        run: npm run build

      - name: Verify build profiles
        run: npm run verify:profiles

      - name: Verify test skip budget
        run: npm run verify:test-skips

      - name: Verify committed generated artifacts are fresh
        run: git diff --exit-code -- plugins/skin.user.js dist

      - name: Run complete test suite
        run: npm run test:all

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run smoke:browser
